plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.screenstream'
    compileSdk 34

    defaultConfig {
        applicationId "com.screenstream"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Modern Java target (safe for AGP 8+)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {

    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // =========================
    // RTSP STACK (MATCHES KOTLIN 2.2 ECOSYSTEM)
    // =========================
    implementation "com.github.pedroSG94.RootEncoder:library:2.6.6"
    implementation "com.github.pedroSG94:RTSP-Server:1.3.6"

    // Coroutines (safe modern version aligned with Kotlin 2.x ecosystem)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // =========================
    // TEST
    // =========================
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
