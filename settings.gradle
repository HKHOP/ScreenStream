pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Adds the JitPack repository so Gradle can find and download the RTSP engine
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "ScreenStream"
include ':app'
